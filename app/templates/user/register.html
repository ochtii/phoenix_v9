{# phoenix/app/templates/user/register.html #}
{% extends "base.html" %}
{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user/register.css') }}">
{% endblock %}
{% block content %}
<div class="register-container">
    <h2>Register</h2>
    <form method="POST" action="{{ url_for('user.register') }}">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('user.login') }}">Login here</a>.</p>
</div>
{% endblock %}
{% block scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/user/register.js') }}"></script>
{% endblock %}
