{# phoenix/app/templates/support/new_ticket.html #}
{% extends "base.html" %}
{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/support/new_ticket.css') }}">
{% endblock %}
{% block content %}
<div class="new-ticket-container">
    <h2>New Support Ticket</h2>
    <form method="POST" action="{{ url_for('support.new_ticket') }}">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>
        <button type="submit">Create Ticket</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/support/new_ticket.js') }}"></script>
{% endblock %}
